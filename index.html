essline span{display:block;height:100%;background:var(--gold);border-radius:inherit}.mini-task{padding:9px 0;border-top:1px solid #2b3036;display:flex;justify-content:space-between;gap:12px;cursor:pointer}.mini-task:hover .mini-name{color:var(--gold2)}.mini-name{font-size:13px}.mini-date{color:var(--muted);font-size:11px;text-align:right}.table-wrap{overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{text-align:left;padding:13px 15px;border-bottom:1px solid #2a2e34}.table th{color:var(--muted);font-size:12px;font-weight:500;background:#1d2126}.table tr:last-child td{border-bottom:0}.table tbody tr:hover{background:#22272d}.status{display:inline-flex;padding:3px 8px;border-radius:99px;font-size:11px;background:#30343a;color:#c4cad2}.status.in{background:#253c52;color:#afd4fa}.status.done{background:#204035;color:#a9e8c7}.modal-backdrop{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:20px}.modal-backdrop.open{display:flex}.modal{background:#1a1e23;border:1px solid #454b54;border-radius:17px;width:min(600px,100%);box-shadow:var(--shadow);max-height:90vh;overflow:auto}.modal-head{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.modal-body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;color:var(--muted)}.field input,.field select,.field textarea{background:#111417;border:1px solid #3b424b;color:var(--text);padding:10px;border-radius:9px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.modal-foot{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:space-between}.foot-right{display:flex;gap:8px}.close{background:transparent;font-size:20px;color:var(--muted)}.hint{font-size:12px;color:var(--muted);margin-top:10px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#f2f3f5;color:#141618;padding:10px 15px;border-radius:9px;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:720px){.app{padding:23px 16px 38px}.top{display:block}.actions{justify-content:flex-start;margin-top:18px}.dashboard{grid-template-columns:repeat(2,1fr)}.modal-body{grid-template-columns:1fr}.field.full{grid-column:auto}.monthbar{grid-template-columns:145px repeat(8,1fr)}.taskrow{grid-template-columns:145px 1fr}.search{min-width:160px}}

<body>
  <main class="app">
    <header class="top"><div><div class="eyebrow">GRADUATION PROJECT · 2026—2027</div><h1 class="title">畢業製作時間表</h1></div><div class="actions"><button class="btn" id="importBtn">匯入 CSV</button><button class="btn" id="exportBtn">匯出 CSV</button><button class="btn primary" id="addBtn">＋ 新增任務</button><input type="file" id="fileInput" accept=".csv,text/csv" hidden /></div></header>
    <section class="dashboard" id="dashboard"></section>
    <div class="toolbar"><div class="tabs"><button class="tab active" data-view="overview">總表</button><button class="tab" data-view="songs">依歌曲</button><button class="tab" data-view="list">任務清單</button></div><div class="filters"><input class="control search" id="search" placeholder="搜尋任務或歌曲…" /><select class="control" id="category"><option value="all">所有分類</option></select><select class="control" id="status"><option value="all">所有狀態</option><option>Not started</option><option>In progress</option><option>Done</option></select></div></div>
    <section class="view active" id="overview"></section><section class="view" id="songs"></section><section class="view" id="list"></section>
  </main>
  <div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="taskForm"><div class="modal-head"><div><div class="eyebrow">TASK EDITOR</div><h2 id="modalTitle" style="margin:4px 0 0">新增任務</h2></div><button type="button" class="close" id="closeModal">×</button></div><div class="modal-body"><input type="hidden" id="taskId" /><div class="field full"><label>任務名稱</label><input id="name" required /></div><div class="field"><label>歌曲／分類</label><input id="kind" list="kindOptions" required /><datalist id="kindOptions"></datalist></div><div class="field"><label>狀態</label><select id="taskStatus"><option>Not started</option><option>In progress</option><option>Done</option></select></div><div class="field"><label>開始日期</label><input id="start" type="date" required /></div><div class="field"><label>結束日期</label><input id="end" type="date" required /></div><div class="field full"><label>備註（選填）</label><textarea id="note" rows="3" placeholder="補充錄音地點、檔案連結或下一步…"></textarea></div></div><div class="modal-foot"><button type="button" class="btn danger" id="deleteBtn">刪除任務</button><div class="foot-right"><button type="button" class="btn" id="cancelBtn">取消</button><button class="btn primary">儲存變更</button></div></div></form></div><div class="toast" id="toast"></div>
  <script>
    const seed=[
      ['編完','2026-10-16','2026-10-20','Not started','祝你快樂'],['寫完','2026-10-16','2026-10-23','In progress','快結束這個漫長的夏天'],['樂器edit','2026-10-24','2026-10-28','Not started','也不想這樣什麼都寫成歌'],['vocal 錄音','2026-11-02','2026-11-02','Not started','也不想這樣什麼都寫成歌'],['討論','2026-11-17','2026-11-30','Not started','當代瞳孔'],['AG錄音','2026-11-12','2026-11-12','Not started','祝你快樂'],['vocal 錄音','2026-11-23','2026-11-23','Not started','祝你快樂'],['編曲','2026-11-01','2026-11-25','Not started','快結束這個漫長的夏天'],['決定混音 ref','2026-12-01','2026-12-14','Not started','整體事項'],['vocal rec','2026-12-13','2026-12-13','Not started','快結束這個漫長的夏天'],['edit完送混','2026-12-01','2026-12-14','Not started','祝你快樂'],['上學期結案報告','2026-12-18','2026-12-31','Not started','整體事項'],['vocal錄音？','2026-12-31','2027-01-13','Not started','當代瞳孔'],['編曲定案？','2026-12-15','2026-12-28','Not started','當代瞳孔'],['edit完送混','2026-12-01','2026-12-14','Not started','也不想這樣什麼都寫成歌'],['edit完送混','2027-02-01','2027-02-14','Not started','快結束這個漫長的夏天'],['母帶','2027-01-18','2027-01-31','Not started','祝你快樂'],['母帶','2027-01-18','2027-01-31','Not started','也不想這樣什麼都寫成歌'],['上架','2027-02-15','2027-03-09','Not started','祝你快樂'],['狂拍reels？','2027-02-15','2027-03-30','Not started','整體事項'],['inst. rec','2027-01-18','2027-01-31','Not started','當代瞳孔'],['edit完送混','2027-02-01','2027-02-14','Not started','當代瞳孔'],['母帶','2027-03-10','2027-03-21','Not started','當代瞳孔'],['母帶','2027-03-11','2027-03-21','Not started','快結束這個漫長的夏天'],['EP上架','2027-04-12','2027-04-22','Not started','整體事項'],['動畫','2027-02-10','2027-03-31','Not started','也不想這樣什麼都寫成歌'],['周邊預購調查','2027-04-12','2027-04-22','Not started','整體事項']
    ];
    const months=[['2026-10','十月'],['2026-11','十一月'],['2026-12','十二月'],['2027-01','一月'],['2027-02','二月'],['2027-03','三月'],['2027-04','四月'],['2027-05','五月']];
    const extraCategories=['影像','視覺設計','周邊商品','網頁設計','上架流程'];
    const categoryOrder=['當代瞳孔','快結束這個漫長的夏天','祝你快樂','後記','也不想這樣什麼都寫成歌','整體事項','影像','視覺設計','周邊商品','網頁設計','上架流程'];
    let tasks=JSON.parse(localStorage.getItem('gradTasks')||'null')||seed.map((x,i)=>({id:String(i+1),name:x[0],start:x[1],end:x[2],status:x[3],kind:x[4],note:''}));
    let editingId=null;
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const fmt=d=>new Intl.DateTimeFormat('zh-TW',{month:'numeric',day:'numeric'}).format(new Date(d+'T00:00:00'));
    const fmtRange=t=>t.start===t.end?fmt(t.start):`${fmt(t.start)} – ${fmt(t.end)}`;
    const save=()=>localStorage.setItem('gradTasks',JSON.stringify(tasks));
    const filtered=()=>{const q=$('#search').value.toLowerCase().trim(),c=$('#category').value,s=$('#status').value;return tasks.filter(t=>(!q||`${t.name} ${t.kind} ${t.note}`.toLowerCase().includes(q))&&(c==='all'||t.kind===c)&&(s==='all'||t.status===s)).sort((a,b)=>a.start.localeCompare(b.start));};
    function statusClass(s){return s==='Done'?'done':s==='In progress'?'in':''}
    function render(){renderControls();renderDashboard();renderOverview();renderSongs();renderList();}
    function renderControls(){const kinds=[...new Set([...categoryOrder,...tasks.map(t=>t.kind)])];const old=$('#category').value;$('#category').innerHTML='<option value="all">所有分類</option>'+kinds.map(k=>`<option>${esc(k)}</option>`).join('');if(kinds.includes(old))$('#category').value=old;$('#kindOptions').innerHTML=kinds.map(k=>`<option value="${esc(k)}">`).join('');}
    function renderDashboard(){const done=tasks.filter(t=>t.status==='Done').length,active=tasks.filter(t=>t.status==='In progress').length,kinds=new Set(tasks.map(t=>t.kind)).size;$('#dashboard').innerHTML=`<div class="stat"><div class="stat-label">全部任務</div><div class="stat-value">${tasks.length}</div></div><div class="stat"><div class="stat-label">進行中</div><div class="stat-value" style="color:var(--blue)">${active}</div></div><div class="stat"><div class="stat-label">已完成</div><div class="stat-value" style="color:var(--green)">${done}</div></div><div class="stat"><div class="stat-label">歌曲／分類</div><div class="stat-value" style="color:var(--gold2)">${kinds}</div></div>`}
    function renderOverview(){const data=filtered();let html='<div class="board"><div class="timeline"><div class="monthbar"><div><strong>任務</strong>2026.10 — 2027.05</div>'+months.map(m=>`<div><strong>${m[1]}</strong>${m[0].replace('-','.')}</div>`).join('')+'</div>';html+=data.length?data.map(t=>`<div class="taskrow"><div class="taskname" title="${esc(t.kind)}"><span class="dot ${statusClass(t.status)}"></span><span>${esc(t.name)}</span></div><div class="grid"><button class="bar ${barClass(t)}" style="left:${leftPct(t.start)}%;width:${Math.max(widthPct(t.start,t.end),4)}%" data-edit="${t.id}" title="${esc(t.kind)} · ${fmtRange(t)}">${esc(t.name)}</button></div></div>`).join(''):'<div class="empty">找不到符合條件的任務</div>';$('#overview').innerHTML=html+'</div></div>';$$('[data-edit]').forEach(b=>b.onclick=()=>openModal(b.dataset.edit));}
    function leftPct(d){const total=months.length, first=new Date('2026-10-01'), x=(new Date(d+'T00:00:00')-first)/86400000;return Math.max(0,Math.min(100,x/(212)*100))}
    function widthPct(a,b){const first=new Date(a+'T00:00:00'),last=new Date(b+'T00:00:00');return Math.max(1,((last-first)/86400000+1)/212*100)}
    function barClass(t){return t.kind==='整體事項'?'blue':t.status==='Done'?'green':t.status==='In progress'?'blue':''}

    function parseCsvLine(line){const out=[];let cur='',quote=false;for(const ch of line){if(ch==='"')quote=!quote;else if(ch===','&&!quote){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(x=>x.trim().replace(/^"|"$/g,''))}function parseDate(s){const m=s.match(/(\w+)\s+(\d+),\s+(\d+)/);if(!m)return'';return `${m[3]}-${String(new Date(`${m[1]} 1, ${m[3]}`).getMonth()+1).padStart(2,'0')}-${m[2].padStart(2,'0')}`}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s){const x=$('#toast');x.textContent=s;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),2200)}
